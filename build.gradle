buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
        classpath 'io.realm:realm-gradle-plugin:10.19.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
